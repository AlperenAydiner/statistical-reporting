# Türkçe metinler — statrep tarafından üretilen raporlar için.
# Anahtar noktalı ad alanları: section.* (başlıklar), term.* (terminoloji),
# table.*/figure.* (başlıklar, sütun adları), prose.* (cümle şablonları).
# Anahtarlar en.yaml ile birebir eşleşmelidir.
#
# Not: mean/sd gibi istatistik sembolleri varsayılan olarak "apa_latin"
# stilinde tutulur (APA 7 Türkçe çevirileri Latin sembolleri korur — M, SD).
# "turkish" stili (Ort., SS) M2'de eklenecek bir yapılandırma seçeneğidir.

