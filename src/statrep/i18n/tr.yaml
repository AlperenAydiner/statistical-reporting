table:
  dataset_variables:
    caption: "Tablo {n}. Veri Setinde Yer Alan Değişkenler ve Özellikleri"
  appendix_variables:
    caption: "Tablo {n}. Analiz Değişkenleri Dağılım ve Özet Listesi"
  desc_continuous:
    caption: "Tablo {n}. Sürekli Değişkenler İçin Betimsel İstatistikler"
  desc_categorical:
    caption: "Tablo {n}. Kategorik Değişkenler İçin Betimsel İstatistikler"
  comparison:
    caption: "Tablo {n}. {dv} Değişkeninin {group} Değişkenine Göre Karşılaştırması"
  correlation:
    caption: "Tablo {n}. Korelasyon Matrisi"
  regression:
    caption: "Tablo {n}. {dv} Değişkenini Yordayan Regresyon Sonuçları"
  missing_values:
    caption: "Tablo {n}. Kayıp Değer Özeti"
